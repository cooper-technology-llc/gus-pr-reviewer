name: Gus PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      mode:
        description: Gus action
        required: true
        default: review
        type: choice
        options: [review, issues, review-and-issues]

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.trigger.outputs.eligible }}
      repository: ${{ steps.trigger.outputs.repository }}
      pull_request: ${{ steps.trigger.outputs.pull_request }}
      runtime_sha: ${{ steps.revision.outputs.runtime_sha }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Read Gus from the trusted default branch
        id: runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ github.event.repository.default_branch }}
          sparse-checkout: /.github/gus/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Record the trusted runtime revision
        id: revision
        env:
          GUS_RUNTIME_SHA: ${{ steps.runtime.outputs.commit }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const sha = process.env.GUS_RUNTIME_SHA;
          if (!/^[a-f0-9]{40}$/.test(sha ?? '')) throw new Error('Invalid trusted runtime commit.');
          appendFileSync(process.env.GITHUB_OUTPUT, `runtime_sha=${sha}\n`);
          NODE
      - name: Validate event and requester
        id: trigger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/gus/runtime/bin/gus.mjs trigger --event "$GITHUB_EVENT_PATH" --github-output

  review:
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gus-${{ needs.prepare.outputs.repository }}-${{ needs.prepare.outputs.pull_request }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Read the same trusted Gus runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.runtime_sha }}
          sparse-checkout: /.github/gus/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Ask Gus
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node .github/gus/runtime/bin/gus.mjs review --event "$GITHUB_EVENT_PATH" --publish --format json --output gus-review.json
      - name: Save review artifact
        if: always() && hashFiles('gus-review.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: gus-review-${{ needs.prepare.outputs.pull_request }}-${{ github.run_id }}
          path: gus-review.json
          retention-days: 14
